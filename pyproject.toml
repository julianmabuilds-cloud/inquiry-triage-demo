[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inquiry-triage-demo"
version = "0.2.0"
description = "Offline, typed inquiry triage workflow with a provider boundary"
requires-python = ">=3.9"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.4", "uvicorn==0.34.2", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "mypy==1.15.0", "ruff==0.11.8"]

[project.scripts]
inquiry-triage = "inquiry_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src"]
